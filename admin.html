<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Ady Hanef</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <h1>Admin</h1>
        <p>Enter password to continue</p>
        <form id="login-form">
          <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p id="login-error" class="login-error"></p>
      </div>
    </div>

    <div id="admin-panel" class="admin-panel hidden">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <h2>Admin</h2>
          <span id="admin-user" class="admin-user"></span>
        </div>
        <nav class="admin-nav">
          <button class="nav-item active" data-section="dashboard">Dashboard</button>
          <button class="nav-item" data-section="services">Services</button>
          <button class="nav-item" data-section="projects">Projects</button>
          <button class="nav-item" data-section="blog">Blog</button>
        </nav>
        <div class="admin-footer">
          <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
        </div>
      </aside>

      <main class="admin-main">
        <section id="section-dashboard" class="admin-section">
          <div class="section-header">
            <h1>Dashboard</h1>
            <p>Overview of your content</p>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-number" id="stat-services">0</span>
              <span class="stat-label">Services</span>
            </div>
            <div class="stat-card">
              <span class="stat-number" id="stat-projects">0</span>
              <span class="stat-label">Projects</span>
            </div>
            <div class="stat-card">
              <span class="stat-number" id="stat-blog">0</span>
              <span class="stat-label">Blog Posts</span>
            </div>
          </div>
          <div class="actions-bar">
            <button id="download-all-btn" class="btn btn-primary">Download All JSON</button>
          </div>
        </section>

        <section id="section-services" class="admin-section hidden">
          <div class="section-header">
            <h1>Services</h1>
            <p>Manage your service offerings</p>
          </div>
          <div class="actions-bar">
            <button class="btn btn-primary" data-action="create" data-type="services">Add Service</button>
            <button class="btn btn-secondary" data-action="download" data-type="services">Download JSON</button>
          </div>
          <div class="table-container">
            <table class="data-table" id="table-services">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section id="section-projects" class="admin-section hidden">
          <div class="section-header">
            <h1>Projects</h1>
            <p>Manage your projects and portfolio</p>
          </div>
          <div class="actions-bar">
            <button class="btn btn-primary" data-action="create" data-type="projects">Add Project</button>
            <button class="btn btn-secondary" data-action="download" data-type="projects">Download JSON</button>
          </div>
          <div class="table-container">
            <table class="data-table" id="table-projects">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section id="section-blog" class="admin-section hidden">
          <div class="section-header">
            <h1>Blog</h1>
            <p>Manage your blog posts</p>
          </div>
          <div class="actions-bar">
            <button class="btn btn-primary" data-action="create" data-type="blog">Add Post</button>
            <button class="btn btn-secondary" data-action="download" data-type="blog">Download JSON</button>
          </div>
          <div class="table-container">
            <table class="data-table" id="table-blog">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Title</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/admin/config.js"></script>
  <script src="js/admin/auth.js"></script>
  <script src="js/admin/state.js"></script>
  <script src="js/admin/render.js"></script>
  <script src="js/admin/forms.js"></script>
  <script src="js/admin/export.js"></script>
  <script src="js/admin/index.js"></script>
</body>
</html>
